# Codemagic 云端构建配置：出 iOS ipa（侧载用，无开发者签名）+ Android APK
# 在 codemagic.io 导入仓库后选择此 workflow 即可

workflows:
  ios-sideload:
    name: 川麻 iOS 侧载包
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: 依赖与测试
        script: |
          cd client
          flutter pub get
          flutter test test/engine_test.dart test/exchange_test.dart test/badge_test.dart
      - name: 构建 ipa（无签名）
        script: |
          cd client
          flutter clean
          flutter pub get
          # Xcode 签名相关设置全部禁用
          find ios -name "*.pbxproj" -exec sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' {} +
          find ios -name "*.pbxproj" -exec sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = ""/g' {} +
          find ios -name "*.pbxproj" -exec sed -i '' 's/DEVELOPMENT_TEAM = [A-Z0-9]*/DEVELOPMENT_TEAM = ""/g' {} +
          find ios -name "*.pbxproj" -exec sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = /PROVISIONING_PROFILE_SPECIFIER = ""/g' {} +
          # iOS CocoaPods（如果存在 Podfile）
          cd ios && pod install --repo-update; cd ..
          # 构建 iOS
          flutter build ios --release --no-codesign
          # 手动打 ipa 包
          mkdir -p build/ios/ipa/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r ../chuanmahjong-unsigned.ipa Payload
    artifacts:
      - client/build/ios/ipa/*.ipa

  android-apk:
    name: 川麻 Android APK
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      flutter: stable
    scripts:
      - name: 依赖与测试
        script: |
          cd client
          flutter pub get
          flutter test test/engine_test.dart test/exchange_test.dart test/badge_test.dart
      - name: 构建 APK
        script: |
          cd client
          flutter build apk --release
    artifacts:
      - client/build/app/outputs/flutter-apk/*.apk
